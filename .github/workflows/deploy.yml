name: Deploy to Raspberry Pi

on:
  workflow_run:
    workflows:
      - Django CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch: # добавляет в GitHub кнопку Run Workflow

permissions:
  contents: read

concurrency: # защита от параллельных деплоев
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - deploy

    timeout-minutes: 15

    steps:
      - name: Update repository
        working-directory: /home/adminka/projects/PersonalHub
        run: |
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          git log -1 --format='%h %s'

      - name: Validate Docker Compose
        working-directory: /home/adminka/projects/PersonalHub
        run: docker compose -f compose.yaml -f compose.pipertts.yaml config --quiet

      - name: Build and start application
        working-directory: /home/adminka/projects/PersonalHub
        run: >-
          docker compose -f compose.yaml -f compose.pipertts.yaml
          up -d --build --remove-orphans --wait --wait-timeout 300

      - name: Check application
        working-directory: /home/adminka/projects/PersonalHub
        run: |
          docker compose -f compose.yaml -f compose.pipertts.yaml exec -T web python manage.py check

          for attempt in {1..20}; do
            if curl --fail --silent --show-error --connect-timeout 3 --max-time 5 http://127.0.0.1:18080/health/ > /dev/null; then
              echo "Application is available"
              exit 0
            fi

            echo "Attempt ${attempt}/20 failed; waiting 3 seconds"
            sleep 3
          done

          echo "Application did not become available"
          exit 1

      - name: Show diagnostics on failure
        if: failure()
        working-directory: /home/adminka/projects/PersonalHub
        run: |
          docker compose -f compose.yaml -f compose.pipertts.yaml ps --all
          docker compose -f compose.yaml -f compose.pipertts.yaml logs --tail 100 web pipertts db

          for container in $(docker compose -f compose.yaml -f compose.pipertts.yaml ps --all --quiet); do
            docker inspect --format '{{.Name}} healthcheck={{json .Config.Healthcheck}} health={{json .State.Health}}' "$container"
          done
