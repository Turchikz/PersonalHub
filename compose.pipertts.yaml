services:
  pipertts:
    build:
      context: ./pipertts
    environment:
      PIPER_VOICE: ru_RU-denis-medium
      PIPER_MODELS_DIR: /models
    ports:
    - 127.0.0.1:5001:5000
    volumes:
    - pipertts_models:/models
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',
        timeout=3).close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped
  web:
    environment:
      PIPER_TTS_URL: http://pipertts:5000/synthesize
volumes:
  pipertts_models: null
